[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
# Pinned Yggdrasil, smoltcp, UniFFI and SQLite use different dependency generations.
# Exact versions keep this exception bounded; future updates still need review.
skip = [
  { name = "bitflags", version = "=1.3.2" },
  { name = "block-buffer", version = "=0.10.4" },
  { name = "const-oid", version = "=0.9.6" },
  { name = "cpufeatures", version = "=0.2.17" },
  { name = "crypto-common", version = "=0.1.7" },
  { name = "digest", version = "=0.10.7" },
  { name = "foldhash", version = "=0.1.5" },
  { name = "getrandom", version = "=0.2.17" },
  { name = "getrandom", version = "=0.3.4" },
  { name = "hashbrown", version = "=0.15.5" },
  { name = "rand", version = "=0.8.8" },
  { name = "rand", version = "=0.9.4" },
  { name = "rand_chacha", version = "=0.3.1" },
  { name = "rand_core", version = "=0.6.4" },
  { name = "rand_core", version = "=0.9.5" },
  { name = "serde_spanned", version = "=0.6.9" },
  { name = "sha2", version = "=0.10.9" },
  { name = "syn", version = "=2.0.118" },
  { name = "toml", version = "=0.5.11" },
  { name = "toml", version = "=0.8.23" },
  { name = "toml_datetime", version = "=0.6.11" },
  { name = "toml_edit", version = "=0.22.27" },
  { name = "winnow", version = "=0.7.15" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ratatui/kasuari.git"]
