name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  android:
    name: Android ${{ matrix.api }} / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            target: google_apis
          - api: 35
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.api }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Check baseline map
        run: python3 scripts/check-protocol-coverage.py
      - name: Build isolated test daemon
        run: cargo +1.88.0 build --locked --release -p codex-start --bin codex-start
      - name: Build both native ABIs, check 16 KB alignment, lint and unit tests
        working-directory: android
        run: ./gradlew assembleDebug lintDebug ktlintCheck testDebugUnitTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native loading and Material UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          script: |
            ./android/gradlew -p android connectedDebugAndroidTest
            python3 scripts/test-android-remote.py --serial emulator-5554 --direct
            python3 scripts/test-android-background.py --serial emulator-5554 --doze
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-${{ matrix.api }}-${{ matrix.target }}-reports
          path: android/app/build/reports
