[package]
name = "codex-start"
description = "Run Codex in reproducible Docker or Podman development environments"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "codex-start"

[[bin]]
name = "codex-start"
path = "src/main.rs"

[[bin]]
name = "codex-start-adapter"
path = "src/adapter_main.rs"

[dependencies]
base64.workspace = true
blake3.workspace = true
clap.workspace = true
codex-start-core = { version = "0.2.0-rc.1", path = "../codex-start-core" }
codex-start-proxy = { version = "0.2.0-rc.1", path = "../codex-start-proxy" }
dialoguer.workspace = true
flate2.workspace = true
fs2.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
zeroize.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
portable-pty = "=0.9.0"
nix = { version = "0.31", features = ["signal", "process"] }
codex-start-remote = { version = "0.2.0-rc.1", path = "../codex-start-remote" }
codex-start-transport = { version = "0.2.0-rc.1", path = "../codex-start-transport" }
axum.workspace = true
hex.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
futures.workspace = true
hyper.workspace = true
hyper-util.workspace = true
qrcode.workspace = true

[dev-dependencies]
codex-start-client = { version = "0.2.0-rc.1", path = "../codex-start-client" }
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
